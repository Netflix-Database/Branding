worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	sendfile on;
	keepalive_timeout 65;

	# Only the SVG logo benefits. PNG and ICO are already compressed, so
	# re-compressing them burns CPU to make them marginally larger.
	gzip on;
	gzip_types image/svg+xml;
	gzip_comp_level 6;
	# Below roughly a kilobyte the gzip framing outweighs what it saves.
	gzip_min_length 1024;
	# assets.netdb.at sits behind caches; without Vary a gzipped response
	# can be handed to a client that never asked for one.
	gzip_vary on;

	server {
		listen 80;
		server_name _;

		location = /livez {
			access_log off;
			add_header Cache-Control "no-store" always;
			default_type application/json;
			return 200 '{"status":"ok"}';
		}

		location = /readyz {
			access_log off;
			add_header Cache-Control "no-store" always;
			default_type application/json;
			return 200 '{"status":"ok"}';
		}

		location /logo/ {
			alias /usr/share/nginx/html/logo/;
			autoindex off;
			try_files $uri $uri/ =404;
		}
	}
}
